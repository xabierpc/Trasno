[project]
name = "trasno"
version = "0.1.0"
description = "Asistente personal modular: tareas, horario, entrenos, peso y estadísticas en SQLite, con API FastAPI y panel Streamlit."
readme = "README.md"
authors = [
    { name = "xabier.pcabanas", email = "xabier.pcabanas@udc.es" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "keyring>=25.7.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
trasno = "core.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Layout plano según CLAUDE.md: los paquetes viven en la raíz del repo.
module-root = ""
module-name = ["core", "modules", "agent", "interfaces"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "agent", "interfaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
