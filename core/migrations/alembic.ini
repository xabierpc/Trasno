# Alembic propio de core (core.sqlite). Uso:
#   uv run alembic -c core/migrations/alembic.ini upgrade head
#   uv run alembic -c core/migrations/alembic.ini revision --autogenerate -m "mensaje"
# La ruta de la base de datos sale de Settings (TRASNO_DATA_DIR), no de este fichero.

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
